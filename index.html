<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEAT POP</title>
<meta name="theme-color" content="#7b03fe">
<link rel="icon" id="fav" href=""><link rel="apple-touch-icon" id="fav2" href="">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--green:#6efe00;--purple:#7b03fe;--dark:#14002e;--card:#22004d;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;background:var(--dark);color:#fff;padding-bottom:110px;min-height:100vh}
header{background:var(--green);padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.logo{width:60px;height:60px;border-radius:50%;flex-shrink:0;cursor:pointer;display:block}
.brand{font-family:'Archivo Black',Arial Black,sans-serif;font-size:26px;color:var(--purple);cursor:pointer}
.brand sup{font-size:10px}
.search{flex:1;min-width:200px;display:flex}
.search input{flex:1;padding:12px 16px;border-radius:30px 0 0 30px;border:3px solid var(--purple);font-size:16px;outline:none}
.search button{padding:0 18px;border:none;border-radius:0 30px 30px 0;background:var(--purple);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
nav{display:flex;gap:10px;padding:14px 20px}
nav button{background:var(--card);color:#fff;border:2px solid var(--purple);border-radius:20px;padding:8px 18px;font-weight:600;cursor:pointer}
nav button.on{background:var(--green);color:var(--purple);border-color:var(--green)}
main{padding:0 20px}
h2{font-family:'Archivo Black',Arial Black,sans-serif;color:var(--green);margin:18px 0 10px;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.row{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}
.row .card{min-width:150px;max-width:150px}
.card{background:var(--card);border-radius:14px;padding:10px;cursor:pointer;position:relative;transition:transform .15s}
.card:hover{transform:translateY(-4px);background:#2e0066}
.card img{width:100%;aspect-ratio:1;border-radius:10px;display:block;object-fit:cover}
.card .t{font-weight:800;font-size:14px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .a{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .heart{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.55);border:none;color:#fff;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer}
.card .heart.on{color:var(--green)}
.card.playing{outline:3px solid var(--green)}
.msg{opacity:.7;padding:30px 0;text-align:center}
#player{position:fixed;left:0;right:0;bottom:0;background:var(--purple);padding:10px 16px;display:none;align-items:center;gap:12px;z-index:10;box-shadow:0 -4px 20px rgba(0,0,0,.5)}
#player img{width:56px;height:56px;border-radius:8px}
#pinfo{flex:1;min-width:0}
#ptitle{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#partist{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{height:6px;background:rgba(255,255,255,.3);border-radius:3px;margin-top:6px;cursor:pointer}
#fill{height:100%;width:0;background:var(--green);border-radius:3px}
.pbtn{background:var(--green);color:var(--purple);border:none;border-radius:50%;width:44px;height:44px;font-size:18px;font-weight:900;cursor:pointer;flex-shrink:0}
.pbtn.sm{width:36px;height:36px;font-size:14px;background:#fff}
#full{background:#fff;color:var(--purple);border:none;border-radius:20px;padding:8px 12px;font-weight:800;cursor:pointer;flex-shrink:0;font-size:12px}
#vbox{position:fixed;right:12px;bottom:92px;width:260px;background:#000;border:3px solid var(--green);border-radius:12px;overflow:hidden;z-index:11;display:none}#vbox .vh{display:flex;justify-content:space-between;align-items:center;background:var(--green);color:var(--purple);font-weight:800;font-size:12px;padding:3px 8px}#vbox .vh button{background:none;border:none;color:var(--purple);font-weight:900;cursor:pointer;font-size:14px}#vwrap{width:100%;aspect-ratio:16/9}#vwrap iframe,#yt{width:100%;height:100%;display:block}#vbox.mini #vwrap{height:0}
footer{text-align:center;opacity:.5;font-size:12px;padding:30px}
@media(max-width:600px){#full{padding:8px 9px;font-size:11px}#player{gap:7px;padding:10px}.pbtn.sm{width:30px;height:30px;font-size:11px}#player img{width:44px;height:44px}.brand{font-size:20px}}

.card.unrel { opacity: .85; }
.ucov { width: 100%; aspect-ratio: 1; border-radius: 10px; background: linear-gradient(135deg,#2a2a2a,#555); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 34px; color: #ddd; }
.ucov span { font-size: 10px; letter-spacing: 2px; margin-top: 6px; font-weight: 700; }
#dsbox { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 24px; }
#dsbox .ds { background: #1c1c1e; color: #fff; border-radius: 16px; padding: 22px; max-width: 340px; text-align: center; font-family: inherit; }
#dsbox h3 { margin: 0 0 10px; font-size: 19px; }
#dsbox p { margin: 0 0 18px; font-size: 15px; line-height: 1.4; color: #ccc; }
#dsbox button { background: #7b03fe; color: #fff; border: 0; border-radius: 22px; padding: 10px 34px; font-size: 15px; font-weight: 700; }
</style>
</head>

  { title: 'Pink Tights', artist: 'Lady Gaga' }
];
UNRELEASED.forEach(function (s, i) {
  s.id = 'unrel' + i; s.unreleased = true; s.album = 'Unreleased'; s.art = ''; s.preview = '';
});
function unreleasedFor(q) {
  q = q.toLowerCase();
  return UNRELEASED.filter(function (s) {
    var t = (s.title + ' ' + s.artist).toLowerCase();
    return q.split(/\s+/).every(function (w) { return t.indexOf(w) > -1; }) ||
      s.title.toLowerCase().indexOf(q) > -1 || s.artist.toLowerCase().indexOf(q) > -1;
  });
}
function showDownside() {
  document.getElementById('dsbox').style.display = 'flex';
}
function hideDownside() {
  document.getElementById('dsbox').style.display = 'none';
}

var homeRows = [
  ['Pop Hits', 'pop hits'],
  ['Lady Gaga', 'lady gaga'],
  ['Taylor Swift', 'taylor swift'],
  ['Hip Hop', 'hip hop'],
  ['Throwbacks', '2000s pop']
];

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, function (c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function itunes(term, limit) {
  var url = 'https://itunes.apple.com/search?media=music&entity=song&limit=' + (limit || 25) + '&term=' + encodeURIComponent(term);
  return fetch(url).then(function (r) { return r.json(); }).then(function (d) {
    return d.results.filter(function (s) { return s.previewUrl; }).map(function (s) {
      return {
        id: s.trackId,
        title: s.trackName,
        artist: s.artistName,
        album: s.collectionName,
        art: (s.artworkUrl100 || '').replace('100x100', '400x400'),
        preview: s.previewUrl
      };
    });
  });
}

function inLib(id) {
  return library.some(function (s) { return s.id === id; });
}

function cardHTML(s, i, listName) {
  if (s.unreleased) {
    return '<div class="card unrel" onclick="showDownside()">' +
      '<div class="ucov">&#128274;<span>UNRELEASED</span></div>' +
      '<div class="t">' + esc(s.title) + '</div>' +
      '<div class="a">' + esc(s.artist) + '</div></div>';
  }
  return '<div class="card" data-id="' + s.id + '" onclick="playFrom(\'' + listName + '\',' + i + ')">' +
    '<img src="' + esc(s.art) + '" alt="" loading="lazy">' +
    '<button class="heart' + (inLib(s.id) ? ' on' : '') + '" onclick="event.stopPropagation();like(\'' + listName + '\',' + i + ',this)">' + (inLib(s.id) ? '&#9829;' : '&#9825;') + '</button>' +
    '<div class="t">' + esc(s.title) + '</div>' +
    '<div class="a">' + esc(s.artist) + '</div></div>';
}

var lists = {};

function setTab(id) {
  document.getElementById('tabHome').className = id === 'home' ? 'on' : '';
  document.getElementById('tabLib').className = id === 'lib' ? 'on' : '';
}

function goHome() {
  setTab('home');
  var main = document.getElementById('main');
  main.innerHTML = '';
  homeRows.forEach(function (row, r) {
    var name = 'row' + r;
    var sec = document.createElement('section');
    sec.innerHTML = '<h2>' + esc(row[0]) + '</h2><div class="row"><div class="msg">Loading...</div></div>';
    main.appendChild(sec);
    itunes(row[1], 15).then(function (songs) {
      lists[name] = songs;
      sec.querySelector('.row').innerHTML = songs.map(function (s, i) { return cardHTML(s, i, name); }).join('');
      markPlaying();
    }).catch(function () {
      sec.querySelector('.row').innerHTML = '<div class="msg">Could not load. Check your internet.</div>';
    });
  });
  if (UNRELEASED.length) {
    lists.unrel = UNRELEASED.slice();
    var us = document.createElement('section');
    us.innerHTML = '<h2>Unreleased</h2><div class="row">' +
      lists.unrel.map(function (s, i) { return cardHTML(s, i, 'unrel'); }).join('') + '</div>';
    main.appendChild(us);
  }
}

function doSearch(e) {
  e.preventDefault();
  var q = document.getElementById('q').value.trim();
  if (!q) return;
  setTab('');
  var main = document.getElementById('main');
  main.innerHTML = '<h2>Results for "' + esc(q) + '"</h2><div class="msg">Searching...</div>';
  itunes(q, 50).catch(function () { return []; }).then(function (songs) {
    songs = unreleasedFor(q).concat(songs);
    lists.search = songs;
    if (!songs.length) {
      main.innerHTML = '<h2>Results for "' + esc(q) + '"</h2><div class="msg">No songs found.</div>';
      return;
    }
    main.innerHTML = '<h2>Results for "' + esc(q) + '"</h2><div class="grid">' +
      songs.map(function (s, i) { return cardHTML(s, i, 'search'); }).join('') + '</div>';
    markPlaying();
  }).catch(function () {
    main.innerHTML = '<div class="msg">Search failed. Check your internet.</div>';
  });
}

function goLib() {
  setTab('lib');
  lists.lib = library.slice();
  var main = document.getElementById('main');
  if (!library.length) {
    main.innerHTML = '<h2>My Library</h2><div class="msg">No songs yet. Tap the heart on any song to save it here.</div>';
    return;
  }
  main.innerHTML = '<h2>My Library (' + library.length + ')</h2><div class="grid">' +
    lists.lib.map(function (s, i) { return cardHTML(s, i, 'lib'); }).join('') + '</div>';
  markPlaying();
}

function like(listName, i, btn) {
  var s = lists[listName][i];
  if (s.unreleased) { showDownside(); return; }
  if (inLib(s.id)) {
    library = library.filter(function (x) { return x.id !== s.id; });
  } else {
    library.unshift(s);
  }
  localStorage.setItem('beatpop_library', JSON.stringify(library));
  if (listName === 'lib') { goLib(); return; }
  btn.className = 'heart' + (inLib(s.id) ? ' on' : '');
  btn.innerHTML = inLib(s.id) ? '&#9829;' : '&#9825;';
}

function playFrom(listName, i) {
  queue = lists[listName].slice();
  play(i);
}

// ===== Full songs (YouTube) =====
// Optional: paste a free YouTube Data API key here for the most reliable search.
// Leave it empty and BEAT POP uses free public search servers instead.
// true = play Apple Music 30 sec previews (fast, always works). false = try full songs from YouTube.
var PREVIEW_ONLY = true;
var YT_KEY = '';
var PIPED = ['https://api.piped.private.coffee', 'https://pipedapi.kavin.rocks'];
var INVID = ['https://invidious.f5.si', 'https://inv.nadeko.net', 'https://yewtu.be'];

var yt = null, ytReady = false, mode = 'none', tries = [], tryIdx = 0, pendingId = null;

function onYouTubeIframeAPIReady() {
  yt = new YT.Player('yt', {
    height: '100%', width: '100%',
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
    events: {
      onReady: function () { ytReady = true; if (pendingId) { yt.loadVideoById(pendingId); pendingId = null; } },
      onStateChange: function (e) {
        if (mode !== 'yt') return;
        if (e.data === 1) setPP(true);
        if (e.data === 2) setPP(false);
        if (e.data === 0) next();
      },
      onError: function () { if (mode === 'yt') tryNextVideo(); }
    }
  });
}

function timeout(p, ms) {
  return Promise.race([p, new Promise(function (_, rej) { setTimeout(function () { rej('timeout'); }, ms); })]);
}
function getJSON(url) { return timeout(fetch(url).then(function (r) { if (!r.ok) throw r.status; return r.json(); }), 7000); }

function findVideos(s) {
  var q = s.artist + ' ' + s.title;
  var jobs = [];
  if (YT_KEY) {
    jobs.push(function () {
      return getJSON('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=5&q=' + encodeURIComponent(q + ' audio') + '&key=' + YT_KEY)
        .then(function (d) { return d.items.map(function (x) { return x.id.videoId; }); });
    });
  }
  PIPED.forEach(function (b) {
    jobs.push(function () {
      return getJSON(b + '/search?filter=music_songs&q=' + encodeURIComponent(q)).then(function (d) {
        return d.items.filter(function (x) { return x.url && x.url.indexOf('v=') > -1; }).slice(0, 5)
          .map(function (x) { return x.url.split('v=')[1].split('&')[0]; });
      });
    });
  });
  INVID.forEach(function (b) {
    jobs.push(function () {
      return getJSON(b + '/api/v1/search?type=video&q=' + encodeURIComponent(q + ' audio')).then(function (d) {
        return d.slice(0, 5).map(function (x) { return x.videoId; });
      });
    });
  });
  var i = 0;
  function nextJob() {
    if (i >= jobs.length) return Promise.reject('none');
    return jobs[i++]().then(function (ids) { ids = ids.filter(Boolean); if (!ids.length) throw 'empty'; return ids; }).catch(nextJob);
  }
  return nextJob();
}

function tryNextVideo() {
  tryIdx++;
  if (tryIdx < tries.length) { yt.loadVideoById(tries[tryIdx]); return; }
  usePreview('Full song not available, playing preview');
}

function usePreview(why) {
  mode = 'preview';
  if (yt && ytReady) try { yt.stopVideo(); } catch (e) {}
  document.getElementById('vbox').style.display = 'none';
  var s = queue[cur];
  if (!s || !s.preview) { showDownside(); return; }
  audio.src = s.preview;
  audio.play();
  document.getElementById('partist').textContent = s.artist + ' - ' + why;
}

function markPlaying() {
  var id = cur >= 0 && queue[cur] ? String(queue[cur].id) : '';
  document.querySelectorAll('.card').forEach(function (c) {
    c.classList.toggle('playing', c.getAttribute('data-id') === id);
  });
}

function play(i) {
  if (i < 0 || i >= queue.length) return;
  if (queue[i].unreleased) { showDownside(); return; }
  cur = i;
  var s = queue[i];
  audio.pause();
  mode = 'loading';
  document.getElementById('player').style.display = 'flex';
  document.getElementById('pimg').src = s.art;
  document.getElementById('ptitle').textContent = s.title;
  document.getElementById('partist').textContent = s.artist + ' - finding full song...';
  document.getElementById('fill').style.width = '0';
  document.title = s.title + ' - BEAT POP';
  markPlaying();
  var mine = i;
  if (PREVIEW_ONLY) { usePreview('30 sec preview'); return; }
  findVideos(s).then(function (ids) {
    if (cur !== mine) return;
    tries = ids; tryIdx = 0; mode = 'yt';
    document.getElementById('partist').textContent = s.artist + ' - full song';
    document.getElementById('vbox').style.display = 'block';
    if (ytReady) yt.loadVideoById(ids[0]); else pendingId = ids[0];
  }).catch(function () {
    if (cur !== mine) return;
    usePreview('30 sec preview');
  });
}

function setPP(playing) { document.getElementById('pp').innerHTML = playing ? '&#10074;&#10074;' : '&#9654;'; }

function toggle() {
  if (mode === 'yt' && ytReady) {
    if (yt.getPlayerState() === 1) yt.pauseVideo(); else yt.playVideo();
  } else {
    if (audio.paused) audio.play(); else audio.pause();
  }
}
function next() {
  var j = cur + 1;
  while (j < queue.length && queue[j].unreleased) j++;
  if (j < queue.length) play(j);
}
function prev() {
  var t = mode === 'yt' && ytReady ? yt.getCurrentTime() : audio.currentTime;
  if (t > 3) { if (mode === 'yt') yt.seekTo(0, true); else audio.currentTime = 0; }
  else if (cur > 0) play(cur - 1);
}

function seek(e) {
  var r = e.currentTarget.getBoundingClientRect();
  var f = (e.clientX - r.left) / r.width;
  if (mode === 'yt' && ytReady) { var d = yt.getDuration(); if (d) yt.seekTo(f * d, true); }
  else if (audio.duration) audio.currentTime = f * audio.duration;
}

function toggleVid() {
  var b = document.getElementById('vbox');
  b.classList.toggle('mini');
  document.getElementById('vtog').textContent = b.classList.contains('mini') ? 'show video' : 'hide video';
}

function fullSong() {
  var s = queue[cur];
  if (!s) return;
  if (mode === 'yt' && tries[tryIdx]) window.open('https://www.youtube.com/watch?v=' + tries[tryIdx], '_blank');
  else window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(s.title + ' ' + s.artist), '_blank');
}

setInterval(function () {
  if (mode === 'yt' && ytReady && yt.getDuration) {
    var d = yt.getDuration();
    if (d) document.getElementById('fill').style.width = (yt.getCurrentTime() / d * 100) + '%';
  }
}, 500);

audio.addEventListener('play', function () { if (mode === 'preview') setPP(true); });
audio.addEventListener('pause', function () { if (mode === 'preview') setPP(false); });
audio.addEventListener('timeupdate', function () {
  if (mode === 'preview' && audio.duration) document.getElementById('fill').style.width = (audio.currentTime / audio.duration * 100) + '%';
});
audio.addEventListener('ended', function () { if (mode === 'preview') next(); });

document.getElementById('fav').href = document.getElementById('fav2').href = document.querySelector('.logo').src;
goHome();
</script>
</body>
